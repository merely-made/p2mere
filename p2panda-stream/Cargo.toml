[package]
name = "p2mere-stream"
version = "0.8.0"
edition = "2024"
authors = [
  "adz <x12@adz.garden>",
  "sandreae <contact@samandreae.com>",
  "glyph <glyph@mycelial.technology>",
]
description = "Event stream processing for p2p data-types (merely-made fork of p2panda)"
repository = "https://github.com/merely-made/p2mere"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["eventsourcing", "processing", "p2p", "local-first", "stream"]
rust-version = "1.96"

[lib]
name = "p2panda_stream"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = [
  "groups",
  "ingest",
  "log_prune",
  "orderer",
  "spaces",
  "hooks",
]
groups = [
  "p2panda-auth/serde",
  "p2panda-store/groups",
  "p2panda-spaces",
  "dep:serde",
]
ingest = [
    "dep:indexmap",
]
log_prune = []
orderer = [
  "p2panda-store/processor",
  "dep:serde",
]
spaces = [
  "p2panda-auth",
  "p2panda-spaces",
  "p2panda-store/spaces",
  "dep:serde",
]
hooks = []

[dependencies]
futures-util = { workspace = true }
indexmap = { version = "2.14.2", optional = true }
p2panda-auth = { workspace = true, optional = true }
p2panda-core = { workspace = true, default-features = true }
p2panda-spaces = { workspace = true, default-features = true, optional = true }
p2panda-store = { workspace = true, default-features = false }
pin-project = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["rt", "sync", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
futures-test = { workspace = true, features = ["std"] }
futures-util = { workspace = true, features = ["alloc"] }
p2panda-auth = { workspace = true, default-features = true, features = ["test_utils"] }
p2panda-core = { workspace = true, default-features = true, features = ["test_utils"] }
p2panda-store = { workspace = true, default-features = true, features = ["test_utils"] }
serde = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["macros", "rt", "sync", "time"] }
tokio-stream = { workspace = true }
